
name: Build L-DROID-G APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -type f -name 'L-DROID-G-source-with-build-workflow.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP do projeto não encontrado no repositório."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi
          mkdir -p /tmp/ldroidg
          unzip -q "$ZIP" -d /tmp/ldroidg
          SETTINGS=$(find /tmp/ldroidg -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Não encontrei settings.gradle dentro do ZIP."
            exit 1
          fi
          cp -a "$(dirname "$SETTINGS")/." .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L-DROID-G-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
